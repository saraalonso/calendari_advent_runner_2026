name: Advent Running
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: advent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executa el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python advent.py run
      - name: Desa l'estat
        run: |
          git config user.name "advent-bot"
          git config user.email "advent-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "estat" && git pull --rebase -q && git push -q)
